<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template: repeat(9, 1fr) / repeat(5, 1fr);
            gap: 5px;
            height: 70vh;
        }

        header {
            grid-row: 1 / 3;
            grid-column: 1 / -1;
            background-color: rgb(197, 135, 255);
        }

        menu {
            grid-row: 3 / 4;
            grid-column: 1 / -1;
            background-color: rgb(209, 104, 104);
        }

        main {
            grid-row: 4 / 9;
            grid-column: 1 / 5;
            background-color: rgb(255, 44, 44);
        }

        aside {
            grid-row: 4 / 9;
            grid-column: 5 / 6;
            background-color: rgb(255, 179, 113);
        }

        footer {
            grid-row: 9 / 10;
            grid-column: 1 / -1;
            background-color: rgb(255, 192, 76);
        }

        header, menu, main, aside, footer {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Topo</header>
        <menu>Menu</menu>
        <main>Principal</main>
        <aside>Secundário</aside>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
